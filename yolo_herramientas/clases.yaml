# ═══════════════════════════════════════════════════════════════════════════════════════════════
#  Clases del YOLO de herramientas y cómo se traduce cada dataset a ellas.
#  El ORDEN de «clases» es el id que ve YOLO: una vez entrenado un modelo, no lo cambiéis
#  (añadid clases nuevas siempre AL FINAL).
# ═══════════════════════════════════════════════════════════════════════════════════════════════
clases:
  - mango              # 0 · la parte por la que se coge (de CUALQUIER herramienta): una instancia por herramienta
  - martillo           # 1
  - alicates           # 2 · de punta, universales, de corte, de presión…
  - destornillador     # 3
  - llave              # 4 · inglesa, fija, combinada, grifa
  - carraca            # 5
  - taladro            # 6 · taladro / atornillador de batería
  - tijeras            # 7
  - cuchillo           # 8 · cúter, cuchillo
  - flexometro         # 9
  - sierra             # 10 · serrucho, sierra de arco
  - cinta_aislante     # 11 · cinta aislante / adhesiva
  - cincel             # 12
  - mazo               # 13
  - pala               # 14
  - sargento           # 15 · sargento / mordaza
  - paleta             # 16 · paleta de albañil, llana
  - cepillo_carpintero # 17
  - tijera_chapa       # 18
  - amoladora          # 19 · radial
  - regla              # 20
  - lima               # 21
  - brocha             # 22 · brocha, cepillo de púas
  - grapadora          # 23 · grapadora, grapadora de obra
  - nivel              # 24
  - rotulador          # 25 · rotulador, lápiz, bolígrafo
  - escuadra           # 26
  - rastrillo          # 27
  - pistola_silicona   # 28
  - llave_allen        # 29
  - espatula           # 30
  - hacha              # 31
  - palanca            # 32 · palanqueta, pata de cabra
  - soldador           # 33 · soldador de estaño
  - calibre            # 34 · pie de rey
  - linterna           # 35
  - remachadora        # 36
  - motosierra         # 37

# ── PACO-LVIS (convertir_paco.py) ── nombre del objeto en PACO → nuestra clase
paco:
  objetos:
    hammer: martillo
    pliers: alicates
    screwdriver: destornillador
    wrench: llave
    drill: taladro
    scissors: tijeras
    knife: cuchillo
  partes_mango: [handle, grip]     # partes de PACO que juntas son el «mango» (p. ej. hammer:handle + hammer:grip)

# ── HANDAL (convertir_handal.py) ── palabra que aparece en la ruta de la escena → nuestra clase
#    (las categorías de cocina de HANDAL —ladle, mug, pan, spatula, strainer, utensil, whisk,
#    measuring cup— no se usan)
handal:
  ratchet: carraca              # antes que «wrench» (alguna carpeta puede llamarse «ratchet_wrench»)
  hammer: martillo
  plier: alicates
  screwdriver: destornillador
  wrench: llave
  drill: taladro

# ── Nombres de clase de CUALQUIER otro dataset (Roboflow, Open Images, METU-ALET, herramientas de obra,
#    CVAT…; convertir_yolo_seg.py) → nuestra clase. Se compara en minúsculas. Lo que no esté aquí se
#    ignora y el script lo dice: si veis algo útil en esa lista, añadidlo aquí.
nombres:
  mango: mango
  handle: mango
  grip: mango
  # martillo
  hammer: martillo
  claw hammer: martillo
  curved_claw_hammer: martillo
  martillo: martillo
  # alicates
  pliers: alicates
  plier: alicates
  cutting pliers: alicates
  needle-nose pliers: alicates
  alicates: alicates
  # destornillador
  screwdriver: destornillador
  screwdriver+: destornillador
  destornillador: destornillador
  # llave
  wrench: llave
  spanner: llave
  crescent wrench: llave
  сrescent wrench: llave        # (en Roboflow viene con una «С» cirílica)
  gas wrench: llave
  llave: llave
  # resto de las de taller
  ratchet: carraca
  drill: taladro
  "drill (tool)": taladro       # Open Images
  power drill: taladro
  drill machine: taladro
  scissors: tijeras
  knife: cuchillo
  cutter: cuchillo
  utility knife: cuchillo
  "kitchen knife": cuchillo     # Open Images
  tape measure: flexometro
  meter: flexometro             # METU-ALET (el metro de cinta)
  handsaw: sierra
  saw: sierra
  hacksaw: sierra
  electrical tape: cinta_aislante
  tape: cinta_aislante          # METU-ALET
  chisel: cincel
  mallet: mazo
  spade: pala
  shovel: pala
  clamp: sargento
  trowel: paleta
  plane: cepillo_carpintero
  aviation snip: tijera_chapa
  grinder: amoladora
  angle grinder: amoladora
  ruler: regla
  file: lima
  brush: brocha
  stapler: grapadora
  staple gun: grapadora
  tacker: grapadora
  level: nivel
  spirit level: nivel
  marker: rotulador
  pen: rotulador
  pencil: rotulador
  square: escuadra
  rake: rastrillo
  caulk gun: pistola_silicona
  hex key: llave_allen
  allen key: llave_allen
  putty knife: espatula
  axe: hacha
  crowbar: palanca
  soldering iron: soldador
  soldering_iron: soldador
  caliper: calibre
  flashlight: linterna
  torch: linterna
  riveter: remachadora
  chainsaw: motosierra
  # y vuestros nombres de CVAT, si los ponéis en castellano, salen solos (mismo nombre que la clase)

# ── Open Images V7 (descargar_open_images.py) ── clases a bajar (nombre exacto de Open Images).
#    Las que no existan en Open Images se saltan con un aviso.
open_images:
  clases: [Hammer, Screwdriver, "Drill (Tool)", Wrench, Scissors, Chainsaw, Axe, Flashlight, Ruler, "Kitchen knife"]
  max_por_split: 6000            # imágenes como mucho por split (train / validation)

# ── Dataset Ninja (descargar.sh ninja) ── datasets en formato Supervisely (cajas)
dataset_ninja:
  - METU-ALET                    # 49 herramientas, ~2,7 GB
  # - Small Size Construction Tools   # 12 herramientas de obra, ~132 GB (descomentad si hay disco)

# ── Roboflow Universe (descargar_roboflow.py) ── la versión es la que sale en la web del proyecto.
#    tipo: seg = ya trae máscaras · cajas = solo cajas (se les saca la máscara con SAM)
roboflow:
  - {workspace: a-gbzqd, proyecto: tools-segmentation-0jsgu, version: 1, tipo: seg}
  - {workspace: arcad-bef2o, proyecto: tools-segmentation-ul4wk-gcjyh, version: 1, tipo: seg}
  - {workspace: dmitri-belgorodov, proyecto: tools-segmentation-2-4hxds, version: 1, tipo: seg}
  - {workspace: mechanical-tools, proyecto: mechanical-tools-10000, version: 1, tipo: cajas}
